name: Build and publish PS5 ELF

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check frontend-only repository
        run: |
          python3 scripts/check-release.py --source
          python3 scripts/test-release.py
      - name: Build pinned PS5 toolchain
        run: docker build -t ps5library-build -f docker/ps5-build.Dockerfile .
      - name: Test and build the ELF files
        run: docker run --rm --network none --user "$(id -u):$(id -g)" -e GITHUB_REF -v "$PWD:/workspace" ps5library-build bash scripts/build.sh
      - name: Package corresponding dependency source and notices
        run: python3 scripts/package-sources.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ps5library-elf
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ps5library-elf
          path: dist
      - name: Publish verified ELF release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          cat > "$RUNNER_TEMP/release-notes.txt" <<'EOF'
          PS5Library console frontend engineering preview.

          Send ps5library-install.elf through a compatible homebrew payload loader to install/update. ps5library.elf is the application binary. Enter your own PS5Library server address on first launch.

          Version 0.2.8 refines the approved cinematic storefront layout, bundled Inter typography, translucent focus treatment, controller icons and profile page. Search View All preserves its results. Host checks exercise controller access to Search, Settings and Profile, plus focus restoration and rendering. Runtime data still comes from the configured server.

          Built from this tag after native host tests and ELF/hash verification. Native Downloads submission, backport placement and installation have not been tested on a physical PS5. Native update/DLC installation and external destinations remain unsupported. ShadowMount images use their separate transfer/mount route. HDMI audio and PS-button Home/background behavior remain unresolved.

          This repository contains console code and build assets only. The application still requires a separately hosted PS5Library server. No server address or private update-signing key is bundled.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GH_REPO" --verify-tag \
            --title "PS5Library $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.txt" --prerelease
