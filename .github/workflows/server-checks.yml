name: Server checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: node scripts/upstream.mjs LibProsperoPKG-drakmor UFS2Tool
      - run: npm run check:public-release
      - run: npm run format:check
      - run: npm run format:native:check
      - run: npm run build
      - run: npm test
