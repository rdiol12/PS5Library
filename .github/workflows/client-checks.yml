name: PS5Library checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 scripts/check-release.py --source
      - run: python3 scripts/test-release.py
      - run: python3 frontend/ps5/tests/native_package_metadata.py

  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://ps5library@127.0.0.1:5432/ps5library
      REDIS_URL: redis://127.0.0.1:6379
      DATA_DIR: ./data
      SOURCE_ROOT: ./data/sources
      DUMP_ROOT: ""
      DISK_MARGIN_BYTES: 0
      TRAILER_WORKER_IMAGE: ps5library-build:0.43
      TRAILER_WORKER_MODE: DOCKER
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: ps5library
          POSTGRES_USER: ps5library
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ps5library -d ps5library"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - run: npm ci
        working-directory: server
      - name: Configure isolated test credentials
        working-directory: server
        run: |
          touch .env
          echo "BOOTSTRAP_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm run format:check
        working-directory: server
      - run: npm run format:native:check
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: npm test
        working-directory: server
      - name: Build and check the isolated server/worker image
        run: docker build -f server/docker/server.Dockerfile server
      - name: Build the worker used by integration tests
        run: dotnet build worker/PS5Library.Worker.csproj -c Release
        working-directory: server
      - name: Build the pinned native toolchain and binaries
        run: |
          docker build -t ps5library-build:0.43 -f frontend/docker/ps5-build.Dockerfile frontend
          docker build -t ps5library-native-build:0.3 -f frontend/docker/ps5-native-build.Dockerfile frontend
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -e GITHUB_REF -v "$PWD:/workspace" -w /workspace/frontend \
            ps5library-native-build:0.3 bash scripts/build.sh
      - name: Configure Linux test containers
        run: |
          real_docker="$(command -v docker)"
          host_user="$(id -u):$(id -g)"
          mkdir -p "$RUNNER_TEMP/docker-wrapper"
          cat > "$RUNNER_TEMP/docker-wrapper/docker" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "\${1:-}" == run ]]; then
            shift
            exec "$real_docker" run --add-host=host.docker.internal:host-gateway --user "$host_user" "\$@"
          fi
          exec "$real_docker" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/docker-wrapper/docker"
          echo "$RUNNER_TEMP/docker-wrapper" >> "$GITHUB_PATH"
      - name: Run server integration tests
        run: npm run test:integration
        working-directory: server
      - name: Run native TypeScript tests
        run: npm run test:native
        working-directory: server

  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: sh frontend/ios/check.sh
      - name: Build iPhone companion
        run: >-
          xcodebuild -project frontend/ios/PS5LibraryCompanion.xcodeproj
          -scheme PS5LibraryCompanion -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
